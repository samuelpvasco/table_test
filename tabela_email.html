<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Empresas</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', Arial, sans-serif;
      background: #F4F1EE;
      padding: 40px 24px;
      color: #1a1a1a;
    }

    /* ── Header branding ── */
    .email-header {
      background: #FF6900;
      border-radius: 16px 16px 0 0;
      padding: 24px 28px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .email-header .logo-mark {
      width: 36px;
      height: 36px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      color: #FF6900;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .email-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .email-header p {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      margin-top: 2px;
    }

    /* ── Table card ── */
    .table-card {
      background: #fff;
      border-radius: 0 0 16px 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(255, 105, 0, 0.08), 0 1px 4px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    /* ── Header row ── */
    thead tr th {
      background: #FFF0E6;
      color: #BF4E00;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 12px 14px;
      text-align: center;
      border-bottom: 2px solid #FFD4AA;
    }

    thead tr th:first-child {
      text-align: left;
      padding-left: 20px;
    }

    /* ── Du columns accent line ── */
    thead tr th.du-col {
      border-left: 1px solid #FFD4AA;
    }

    /* ── Body rows ── */
    tbody tr {
      transition: background 0.15s;
    }

    tbody tr:nth-child(odd) {
      background: #fff;
    }

    tbody tr:nth-child(even) {
      background: #FFF8F3;
    }

    tbody tr:not(:last-child) td {
      border-bottom: 1px solid #F0E6DE;
    }

    tbody tr:hover {
      background: #FFF0E6;
    }

    td {
      padding: 13px 14px;
      text-align: center;
      font-size: 13px;
    }

    /* ── Company name cell ── */
    td.name {
      text-align: left;
      padding-left: 20px;
      font-weight: 600;
      font-size: 13px;
      color: #111;
      white-space: nowrap;
    }

    td.du-col {
      border-left: 1px solid #F0E6DE;
    }

    /* ── Status badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .badge-nao {
      background: #FEE2E2;
      color: #B91C1C;
      border: 1px solid #FECACA;
    }

    .badge-nao::before {
      background: #EF4444;
    }

    .badge-sim {
      background: #DCFCE7;
      color: #15803D;
      border: 1px solid #BBF7D0;
    }

    .badge-sim::before {
      background: #22C55E;
    }

    /* ── "Último" column special styling ── */
    td.ultimo-col {
      border-left: 2px solid #FFD4AA;
    }

    th.ultimo-col {
      border-left: 2px solid #FFD4AA;
      background: #FFE8D0;
    }

    /* ── Footer ── */
    .email-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #999;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="email-wrapper">

    <div class="email-header">
      <div class="logo-mark">it</div>
      <div>
        <h1>Relatório de Verificação de Empresas</h1>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Empresas</th>
            <th class="du-col">1du</th>
            <th class="du-col">2du</th>
            <th class="du-col">3du</th>
            <th class="du-col">4du</th>
            <th class="du-col">5du</th>
            <th class="du-col">6du</th>
            <th class="du-col">7du</th>
            <!-- coluna "último" é dinâmica — remova se não houver dado -->
            <th class="du-col ultimo">Último</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="name">TESTE</td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-sim">SIM</span></td>
            <td class="du-col ultimo-col"><span class="badge badge-nao">NÃO</span></td>
          </tr>
          <tr>
            <td class="name">00001 · TESTE TESTE</td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-sim">SIM</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col ultimo-col"><span class="badge badge-sim">SIM</span></td>
          </tr>
          <tr>
            <td class="name">00002 · EXEMPLO LTDA</td>
            <td class="du-col"><span class="badge badge-sim">SIM</span></td>
            <td class="du-col"><span class="badge badge-sim">SIM</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-sim">SIM</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col"><span class="badge badge-nao">NÃO</span></td>
            <td class="du-col ultimo-col"><span class="badge badge-sim">SIM</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
